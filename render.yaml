services:
  - type: web
    name: ff-spam-api
    runtime: python
    plan: starter          # أو free للتجربة
    region: frankfurt      # أقرب للجزائر
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ACCOUNTS_FILE
        value: abdouuu.txt
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1